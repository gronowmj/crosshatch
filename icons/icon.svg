<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#ebe4f6"/>
      <stop offset="100%" stop-color="#cdbae6"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="6" stdDeviation="8" flood-color="#48346e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- White crossword-cell tile, centred -->
  <rect x="107.52" y="107.52" width="296.96" height="296.96" rx="35.635"
        fill="#ffffff" filter="url(#sh)"/>
  <!-- Crossword number 1, top-left of tile -->
  <text x="131.2" y="155" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="53.5" font-weight="700" fill="#9a8ab0">1</text>
  <!-- Large letter C, centred in tile -->
  <text x="256" y="318" text-anchor="middle"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="214" font-weight="700" fill="#2a1f3d">C</text>
</svg>
